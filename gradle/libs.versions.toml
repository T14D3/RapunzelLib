[versions]
# General dependency catalog.
#
# Keep target-independent library versions here. Minecraft-sensitive versions
# belong in gradle/minecraft-targets.properties.
dokka = "2.2.0"
junit-jupiter = "5.10.3"
junit-platform = "1.10.3"
jetbrains-annotations = "26.0.1"
idea-ext = "1.4.1"

adventure = "4.25.0"
adventure-platform-fabric = "6.2.0"
adventure-platform-neoforge = "6.8.0"

fabric-command-api-v2 = "2.4.5+129f1f4cb0"
fabric-events-interaction-v0 = "4.0.41+129f1f4cb0"
fabric-lifecycle-events-v1 = "2.6.14+129f1f4cb0"
fabric-networking-api-v1 = "5.1.3+129f1f4cb0"
fabric-loader = "0.19.2"

snakeyaml = "2.0"
gson = "2.10.1"
slf4j = "2.0.16"
asm = "9.7.1"
brigadier = "1.0.18"
fastutil = "8.5.11"

velocity-api = "3.4.0-SNAPSHOT"
sponge-api = "11.0.0"

# Mixin for NeoForge
mixin = "0.8.7"
mixin-plugin = "0.8-SNAPSHOT"

[plugins]
shadow = { id = "com.gradleup.shadow" }
idea-ext = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "idea-ext" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }

userdev = { id = "io.papermc.paperweight.userdev" }
vanilla-gradle = { id = "org.spongepowered.gradle.vanilla" }
neoforge-moddev = { id = "net.neoforged.moddev" }
fabric-loom = { id = "net.fabricmc.fabric-loom" }
mixin = { id = "org.spongepowered.mixin", version.ref = "mixin-plugin" }
rapunzellib = { id = "de.t14d3.rapunzellib" }


root-subproject-conventions = { id = "de.t14d3.rapunzellib.root-subproject-conventions" }
root-publishing-conventions = { id = "de.t14d3.rapunzellib.root-publishing-conventions" }
