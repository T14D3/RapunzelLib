paper-api = { module = "io.papermc.paper:paper-api" }

velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }

sponge-api = { module = "org.spongepowered:spongeapi", version.ref = "sponge-api" }

spool = { module = "de.t14d3:spool", version = "1.2-SNAPSHOT" }

# Mixin for NeoForge
mixin = { module = "org.spongepowered:mixin", version.ref = "mixin" }
