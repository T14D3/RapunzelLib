platform-neoforge-module-conventions = { id = "de.t14d3.rapunzellib.platform-neoforge-module-conventions" }

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }

adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
