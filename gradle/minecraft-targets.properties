# Central Minecraft target matrix and source of truth for Minecraft-sensitive versions.
#
# Put values here when they vary by Minecraft target or configure a loader/plugin
# differently for a target. gradle/libs.versions.toml should only keep stable
# dependency aliases and target-independent versions, plus fallback versions where
# Gradle requires catalog/bootstrap defaults.

targets=1.21.11,1.21.10,26.1.2
core=26.1.2

# Default Minecraft build toolchain versions used unless a target override exists.
plugin.shadow=9.0.0-beta8
plugin.fabric-loom=1.16-SNAPSHOT
plugin.neoforge-moddev=2.0.137
plugin.vanilla-gradle=0.3.2
plugin.paperweight-userdev=2.0.0-beta.19

# Minecraft 1.21.11
target.1_21_11.version.minecraft=1.21.11
target.1_21_11.version.paper-api=1.21.11-R0.1-SNAPSHOT
target.1_21_11.version.fabric-api=0.138.4+1.21.11
target.1_21_11.version.neoforge=21.11.42
target.1_21_11.plugin.vanilla-gradle=0.2.2
target.1_21_11.fabric.loom-enabled=true
target.1_21_11.fabric.official-mojang-mappings=true

# Minecraft 1.21.10
target.1_21_10.version.minecraft=1.21.10
target.1_21_10.version.paper-api=1.21.10-R0.1-SNAPSHOT
target.1_21_10.version.fabric-api=0.138.4+1.21.10
target.1_21_10.version.neoforge=21.10.64
target.1_21_10.plugin.vanilla-gradle=0.2.2
target.1_21_10.fabric.loom-enabled=true
target.1_21_10.fabric.official-mojang-mappings=true

# Minecraft 26.1.2
target.26_1_2.version.minecraft=26.1.2
target.26_1_2.version.paper-api=26.1.2.build.+
target.26_1_2.version.fabric-api=0.147.0+26.1.2
target.26_1_2.version.fabric-command-api-v2=3.0.7+06488ac1f9
target.26_1_2.version.fabric-events-interaction-v0=5.1.10+c82f04614c
target.26_1_2.version.fabric-lifecycle-events-v1=4.1.0+6d50a0854c
target.26_1_2.version.fabric-networking-api-v1=6.3.0+50a808ce4c
target.26_1_2.version.neoforge=21.11.42
target.26_1_2.plugin.paperweight-userdev=2.0.0-SNAPSHOT
target.26_1_2.fabric.loom-enabled=true
target.26_1_2.fabric.disable-obfuscation=true
target.26_1_2.fabric.official-mojang-mappings=false
