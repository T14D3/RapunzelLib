# Gradle
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dkotlin.daemon.jvm.options=-Xmx384m,-XX:MaxMetaspaceSize=256m,-XX:ReservedCodeCacheSize=192m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.daemon.performance.enable-monitoring=false

# Performance optimizations
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.daemon=true
kotlin.compiler.execution.strategy=in-process

# Settings plugin versions not tied to Minecraft targets
# (mirrors the version in gradle/libs.versions.toml - settings scripts cannot access the catalogue)
foojayResolverVersion=1.0.0
nmcpVersion=1.6.1
