# Gradle
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dkotlin.daemon.jvm.options=-Xmx384m,-XX:MaxMetaspaceSize=256m,-XX:ReservedCodeCacheSize=192m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.daemon.performance.enable-monitoring=false

# Performance optimizations
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.daemon=true
kotlin.compiler.execution.strategy=in-process

# Settings plugin versions
shadowVersion=9.0.0-beta8
fabricLoomVersion=1.13.3
neoforgeModdevVersion=2.0.137
vanillaGradleVersion=0.2.2
foojayResolverVersion=1.0.0
